<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{.Title}}</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body data-revision="{{.Revision}}">
    <main class="deck" id="slide-deck" aria-live="polite" aria-keyshortcuts="O Escape">
      {{range $index, $slide := .Slides}}
      <section class="slide" id="slide-{{inc $index}}" aria-label="Slide {{inc $index}} of {{len $.Slides}}">
        <div class="slide__scroller">
          <div class="slide__content">{{$slide}}</div>
        </div>
      </section>
      {{end}}
    </main>
    <button class="overview-button" type="button" aria-label="Open slide overview" aria-controls="slide-deck" aria-expanded="false" title="Open slide overview">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
      </svg>
    </button>
    <button class="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
      <svg class="fullscreen-button__enter" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path>
      </svg>
      <svg class="fullscreen-button__exit" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"></path>
      </svg>
    </button>
    <button class="overflow-warning" type="button" aria-label="Show overflow warning" aria-live="polite" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M12 3 2.8 20h18.4L12 3Zm0 6v5m0 3.2v.1"></path>
      </svg>
      <span class="overflow-warning__text"></span>
    </button>
    <div class="progress" aria-hidden="true"><span id="current">1</span><span class="progress__rule"></span><span>{{len .Slides}}</span></div>
    <script defer src="/assets/mermaid.min.js"></script>
    <script defer src="/assets/app.js"></script>
  </body>
</html>
