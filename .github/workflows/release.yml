name: Release

on:
  release:
    types:
      - published

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Resolve release commit
        id: release-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main

      - name: Verify successful CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        with:
          script: |
            const retryIntervalMs = 30 * 1000;
            const timeoutMs = 10 * 60 * 1000;
            const deadline = Date.now() + timeoutMs;
            let pushRuns = [];

            while (true) {
              const { data } = await github.request("GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                head_sha: process.env.RELEASE_SHA,
                per_page: 100,
              });

              pushRuns = data.workflow_runs.filter((run) => run.event === "push");
              const successfulRun = pushRuns.find((run) => run.conclusion === "success");
              if (successfulRun) {
                core.info(`Verified successful CI run: ${successfulRun.html_url}`);
                return;
              }

              const remainingMs = deadline - Date.now();
              if (remainingMs <= 0) {
                break;
              }

              core.info(`CI has not completed successfully yet; retrying in 30 seconds (${Math.ceil(remainingMs / 1000)} seconds remaining).`);
              await new Promise((resolve) => setTimeout(resolve, Math.min(retryIntervalMs, remainingMs)));
            }

            const conclusions = pushRuns.length === 0
              ? "no push runs found"
              : pushRuns.map((run) => `${run.html_url}: ${run.status}/${run.conclusion ?? "pending"}`).join(", ");
            core.setFailed(`CI did not complete successfully within 10 minutes for release commit ${process.env.RELEASE_SHA} (${conclusions}).`);

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.13.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cmd/md-present/web/pnpm-lock.yaml

      - name: Generate browser assets
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run assets
        working-directory: cmd/md-present/web

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(go run ./cmd/md-present --version)" = "md-present ${RELEASE_TAG}"
          test "$(jq -r .version plugins/md-present/.codex-plugin/plugin.json)" = "${RELEASE_TAG}"
          test "$(jq -r .version plugins/md-present/.claude-plugin/plugin.json)" = "${RELEASE_TAG}"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "${RELEASE_TAG}"

      - name: Add release binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}

  bump-version:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/bump-version.yml
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
