name: Release

on:
  release:
    types:
      - published

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify successful CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        with:
          script: |
            const { data } = await github.request("GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: process.env.RELEASE_SHA,
              status: "completed",
              per_page: 100,
            });

            const pushRuns = data.workflow_runs.filter((run) => run.event === "push");
            const successfulRun = pushRuns.find((run) => run.conclusion === "success");
            if (!successfulRun) {
              const conclusions = pushRuns.length === 0
                ? "no completed push runs found"
                : pushRuns.map((run) => `${run.html_url}: ${run.conclusion}`).join(", ");
              core.setFailed(`CI has not completed successfully for release commit ${process.env.RELEASE_SHA} (${conclusions}).`);
              return;
            }

            core.info(`Verified successful CI run: ${successfulRun.html_url}`);

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Generate browser assets
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run assets

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(go run ./cmd/md-present --version)" = "md-present ${RELEASE_TAG}"
          test "$(jq -r .version plugins/md-present/.codex-plugin/plugin.json)" = "${RELEASE_TAG}"
          test "$(jq -r .version plugins/md-present/.claude-plugin/plugin.json)" = "${RELEASE_TAG}"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "${RELEASE_TAG}"

      - name: Add release binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}

  bump-version:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/bump-version.yml
