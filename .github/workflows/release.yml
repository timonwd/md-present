name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(go run ./cmd/md-present --version)" = "md-present ${RELEASE_TAG}"
          test "$(jq -r .version plugins/md-present/.codex-plugin/plugin.json)" = "${RELEASE_TAG}"
          test "$(jq -r .version plugins/md-present/.claude-plugin/plugin.json)" = "${RELEASE_TAG}"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "${RELEASE_TAG}"

      - name: Add release binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}
