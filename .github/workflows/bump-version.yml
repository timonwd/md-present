name: Bump version

on:
  workflow_call:
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact version; leave blank to increment the current patch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set version
        id: set-version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            VERSION="$(node scripts/bump-version.mjs "${REQUESTED_VERSION}")"
          else
            VERSION="$(node scripts/bump-version.mjs)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "md-present release bot"
          git config user.email "actions@github.com"
          git add -- \
            cmd/md-present/main.go \
            plugins/md-present/.codex-plugin/plugin.json \
            plugins/md-present/.claude-plugin/plugin.json \
            .claude-plugin/marketplace.json
          git commit -m "Prepare md-present ${VERSION}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
