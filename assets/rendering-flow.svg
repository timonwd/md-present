<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">The md-present rendering flow</title>
  <desc id="description">Markdown is parsed safely, local images are embedded, and the presentation is served to a local browser.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e8f7f2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3157d5"/>
    </marker>
  </defs>
  <rect width="1200" height="480" rx="36" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(70 110)">
      <rect width="260" height="260" rx="28" fill="#ffffff" stroke="#c9d3f4" stroke-width="4"/>
      <path d="M72 62h116M72 104h86M72 146h116M72 188h70" stroke="#3157d5" stroke-width="14" stroke-linecap="round"/>
      <text x="130" y="232" fill="#17191f" font-size="30" font-weight="700">Markdown</text>
    </g>
    <path d="M360 240h105" stroke="#3157d5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(470 110)">
      <rect width="260" height="260" rx="28" fill="#3157d5"/>
      <text x="130" y="120" fill="#ffffff" font-size="38" font-weight="750">md-present</text>
      <text x="130" y="170" fill="#dce4ff" font-size="25">safe rendering</text>
      <text x="130" y="207" fill="#dce4ff" font-size="25">embedded assets</text>
    </g>
    <path d="M760 240h105" stroke="#3157d5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(870 110)">
      <rect width="260" height="260" rx="28" fill="#ffffff" stroke="#c9d3f4" stroke-width="4"/>
      <rect x="38" y="50" width="184" height="128" rx="12" fill="#17191f"/>
      <rect x="56" y="68" width="148" height="92" rx="6" fill="#eef2ff"/>
      <path d="M102 202h56M130 178v24" stroke="#3157d5" stroke-width="10" stroke-linecap="round"/>
      <text x="130" y="240" fill="#17191f" font-size="30" font-weight="700">Browser</text>
    </g>
  </g>
</svg>
